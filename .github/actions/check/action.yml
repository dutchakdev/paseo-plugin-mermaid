name: Check
description: Install dependencies, typecheck, and run the tests.

inputs:
  node-version:
    description: Node.js version. Empty uses .node-version.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts --legacy-peer-deps
    - name: Typecheck
      shell: bash
      run: npm run typecheck
    - name: Run tests
      shell: bash
      run: npm test
